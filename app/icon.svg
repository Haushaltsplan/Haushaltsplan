<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Omnia">
  <defs>
    <linearGradient id="om-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#030304"/>
    </linearGradient>
    <linearGradient id="om-silver" x1="18%" y1="12%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#f1f4f7"/>
      <stop offset="32%" stop-color="#c8cdd4"/>
      <stop offset="68%" stop-color="#8e96a0"/>
      <stop offset="100%" stop-color="#5c6370"/>
    </linearGradient>
    <radialGradient id="om-halo" cx="50%" cy="44%" r="56%">
      <stop offset="0%" stop-color="#9ca89a" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#5a6b62" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#030304" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#om-bg)"/>
  <circle cx="256" cy="242" r="172" fill="url(#om-halo)"/>
  <!-- O: Ring (äußerer Kreis minus innerer Kreis) -->
  <path
    fill="url(#om-silver)"
    fill-rule="evenodd"
    d="M256 64
       A192 192 0 0 1 448 256
       A192 192 0 0 1 256 448
       A192 192 0 0 1 64 256
       A192 192 0 0 1 256 64
       Z
       M256 112
       A144 144 0 0 0 112 256
       A144 144 0 0 0 256 400
       A144 144 0 0 0 400 256
       A144 144 0 0 0 256 112
       Z"
  />
  <!-- „Polierte Kugel“ im O: zwei Großkreise, perfekt symmetrisch -->
  <g fill="none" stroke="url(#om-silver)" stroke-width="18" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="118" ry="64"/>
    <ellipse cx="256" cy="256" rx="64" ry="118"/>
  </g>
</svg>
