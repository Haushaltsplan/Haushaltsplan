<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Omnia">
  <defs>
    <linearGradient id="om-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="om-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="om-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#om-bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.55"/>
  <!-- Cyan center glow (vom Original: Licht in der Mitte) -->
  <circle cx="256" cy="256" r="108" fill="url(#om-glow)"/>
  <!-- „Knoten“: zwei verschlungene Ovale ≈ Unendlich / Alles verknüpft -->
  <g transform="translate(256 256)">
    <ellipse
      cx="-48"
      cy="0"
      rx="86"
      ry="118"
      fill="none"
      stroke="url(#om-metal)"
      stroke-width="26"
      stroke-linecap="round"
      transform="rotate(-6)"
    />
    <ellipse
      cx="48"
      cy="0"
      rx="86"
      ry="118"
      fill="none"
      stroke="url(#om-metal)"
      stroke-width="26"
      stroke-linecap="round"
      transform="rotate(6)"
    />
  </g>
  <!-- Vier Ecken-Icons: Auswertung, Natur, Orientierung, Zeit -->
  <g fill="#e2e8f0">
    <!-- Bar chart (oben links) -->
    <g transform="translate(64,72)">
      <rect x="0" y="32" width="12" height="32" rx="2"/>
      <rect x="20" y="16" width="12" height="48" rx="2"/>
      <rect x="40" y="0" width="12" height="64" rx="2"/>
    </g>
    <!-- Blatt (oben rechts) -->
    <path
      transform="translate(396,68)"
      d="M 50 4 C 78 4 96 28 96 56 C 96 88 68 100 48 100 C 20 100 4 72 4 44 C 4 16 28 4 50 4 Z"
      fill="#e2e8f0"
    />
    <path
      transform="translate(396,68)"
      d="M 48 28 Q 24 44 12 72"
      fill="none"
      stroke="#94a3b8"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <!-- Kompass (unten links) -->
    <g transform="translate(64,400)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
      <polygon points="28,12 32,32 28,28 24,32" fill="#e2e8f0" transform="rotate(45 28 28)"/>
    </g>
    <!-- Kalender (unten rechts) -->
    <g transform="translate(388,388)">
      <rect x="0" y="12" width="60" height="52" rx="6" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
      <line x1="0" y1="28" x2="60" y2="28" stroke="#e2e8f0" stroke-width="2.5"/>
      <line x1="20" y1="0" x2="20" y2="20" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <line x1="40" y1="0" x2="40" y2="20" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
